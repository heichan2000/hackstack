[project]
name = "hackstack"
version = "0.1.0"
description = "A hand-built starter kit for AI agent hackathons."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markitdown[docx]>=0.1.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
hackstack = "hackstack.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "pg: needs Postgres (make up); skipped when it is not reachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
