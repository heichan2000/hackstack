[project]
name = "hackstack"
version = "0.1.0"
description = "A hand-built starter kit for AI agent hackathons."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "markitdown[docx]>=0.1.9",
    "mcp>=1.27,<2",
    "opentelemetry-api>=1.30",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Local cross-encoder reranker (rerank.provider: cross_encoder). CPU torch; `uv sync --extra rerank`
rerank = [
    "sentence-transformers>=5.0",
    "torch>=2.5",
]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.scripts]
hackstack = "hackstack.cli:app"

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.30",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "pg: needs Postgres (make up); skipped when it is not reachable",
    "ollama: needs the local Ollama and its models (make ollama-models); skipped when absent",
    "hf_model: needs the rerank extra and the cross-encoder weights; skipped when absent",
]

# PyPI's Linux torch wheels bundle CUDA (multi-GB); the reranker runs on CPU, so take the CPU
# build there. Windows and macOS PyPI wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
