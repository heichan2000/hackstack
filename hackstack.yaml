# Hackstack settings. Non-secret only: keys and tokens go in .env (see .env.example).
# Any value can be overridden by an env var: HACKSTACK_<SECTION>__<KEY>, e.g. HACKSTACK_RERANK__TOP_N=4.
# The active profile comes from HACKSTACK_PROFILE (default: "default" = the base below).

app: company_brain

llm:
  provider: anthropic            # anthropic | openai_compat
  answer_model: claude-sonnet-5-5
  aux_model: claude-haiku-5-5

embed:
  provider: voyage               # voyage | ollama | openai_compat
  model: voyage-4
  dim: 1024                      # changing the embedder needs `make reset` + re-ingest

store:
  provider: postgres
  dsn: postgresql://hackstack:hackstack@localhost:5433/hackstack

chunk:
  size: 400                      # tokens
  overlap: 0                     # tokens, 0-50

enrich:
  contextual: false              # on: a 50-100 token blurb per chunk from llm.aux_model, re-ingests all docs

retrieval:
  window: 50                     # candidates per retriever

rrf:
  k: 60
  weights: [1.0, 1.0]            # dense, lexical

rerank:
  provider: voyage               # voyage | cross_encoder | noop
  model: rerank-3
  top_n: 8
  window: 50                     # fused candidates the reranker scores (cost scales with it)

expand:
  radius: 1                      # neighbouring chunks per side of each hit; 0 = off
  same_section: true             # don't cross into a sibling heading
  max_chars: 4000                # per passage; the matched chunk itself is never cut

agent:
  max_iterations: 6
  mode: agent                    # agent | single_shot
  history_tokens: 60000          # stored history per turn; older tool results get trimmed first

api:
  cors_origins: [http://localhost:3000, http://127.0.0.1:3000]

tracing:
  enabled: false
  endpoint: http://localhost:6006/v1/traces

# Connector configs come from the active app's app.yaml (apps/<app>/app.yaml). Anything set here
# overrides the app's, key by key, e.g. connectors: {local_files: {path: ./my_docs}}.
connectors: {}

# External MCP servers (stdio). Their tools join the agent's as <server>__<tool>, e.g.
# github__search_issues; a server that fails to start is skipped. ${VAR} in env comes from .env.
#   github:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env: {GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"}
#     tools: [search_issues, get_issue]   # optional allowlist
mcp_servers: {}

profiles:
  # Fully local, no paid APIs: HACKSTACK_PROFILE=local
  local:
    llm:
      provider: openai_compat
      base_url: http://localhost:11434/v1
      # qwen3.5:4b + a 16k context, built by `make ollama-models` (ollama/hackstack-chat.Modelfile).
      # Why: docs/research/local-models.md. Fallback: qwen3:4b-instruct-2507-q4_K_M
      answer_model: hackstack-chat
      aux_model: hackstack-chat
      reasoning_effort: none       # thinking off: ~30% faster, no loss on the tool-call test
    embed:
      provider: ollama
      model: qwen3-embedding:0.6b
      dim: 1024
      base_url: http://localhost:11434
      query_instruction: Given a question, retrieve passages from company documents that answer it
    enrich:
      # Still off by default. On, the 16k-context hackstack-chat costs ~1.5 s per chunk on an
      # RTX 3070 Laptop (docs/research/contextual-enrichment.md); docs over 8k tokens are
      # situated section by section. Ollama serves one request at a time, so no concurrency.
      max_doc_tokens: 8000
      concurrency: 1
    rerank:
      provider: cross_encoder      # CPU, ~1.2 s per 30 candidates; needs `uv sync --extra rerank`
      model: cross-encoder/ms-marco-MiniLM-L6-v2   # set provider: noop to skip reranking
      device: cpu
      window: 30                   # CPU cross-encoder: ~1.2 s for 30, ~2.7 s for 50
    expand:
      max_chars: 2000              # 8 passages stay well inside the local model's 16k context
    agent:
      history_tokens: 5000         # 16k context: ~2k prompt+tools, ~4k per search, room to answer
