# Hand-written golden questions for apps/company_brain, merged into golden.jsonl by make_golden.
#
# Unlike the synthetic ones, these are phrased the way people actually ask, not echoing the
# passage, so they are the honest check on full-text search. They also cover the planted moments
# (apps/company_brain/README.md): both sides of each dated contradiction, ACL-restricted pages,
# and questions the corpus cannot answer.
#
# relevant: chunks that answer the question, as {doc, contains}. `contains` picks the doc's
# chunks whose text includes it (case-insensitive); leave it out to take every chunk of the doc.
# They resolve to chunk ids when the golden set is built, so a chunker change that moves the
# text fails loudly instead of silently invalidating the labels.
#
# kind: handwritten (answerable) | unanswerable (not in the corpus) | forbidden (in the corpus,
# but not visible to as_user: retrieval must return nothing from forbidden_docs).

- id: hw-pto-carryover
